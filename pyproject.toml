[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — a voice-first personal AI operating system."
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Akshay Kumar Goud Bathini" }]
license = { text = "MIT" }

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "typer>=0.12",
    "rich>=13.7",

    # LLM
    "openai>=1.40",
    "httpx>=0.27",
    "tenacity>=8.5",

    # STT
    "faster-whisper>=1.0.3",
    "sounddevice>=0.4.7",
    "numpy>=1.26,<2.1",
    "scipy>=1.13",
    "webrtcvad-wheels>=2.0.14",

    # Wake word
    "openwakeword>=0.6.0",

    # TTS
    "pyttsx3>=2.90",
    "pydub>=0.25",
    "soundfile>=0.12",

    # Memory
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "chromadb>=0.5.5",

    # Agent / tools
    "duckduckgo-search>=6.2",
    "beautifulsoup4>=4.12",
    "requests>=2.32",

    # Server (for mobile / remote in Phase 2)
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",

    # Windows control
    "psutil>=6.0",
    'pyautogui>=0.9.54; platform_system == "Windows"',
    'pywin32>=306; platform_system == "Windows"',
    'pycaw>=20240210; platform_system == "Windows"',
    'comtypes>=1.4; platform_system == "Windows"',
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
]
gpu = [
    "torch>=2.3",
]

[project.scripts]
jarvis = "jarvis.__main__:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
